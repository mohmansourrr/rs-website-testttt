<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#000"/>
  <defs>
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777"/>
      <stop offset="20%" stop-color="#ccc"/>
      <stop offset="40%" stop-color="#eee"/>
      <stop offset="55%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#ddd"/>
      <stop offset="85%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </linearGradient>
  </defs>
  <text x="150" y="195" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="170" font-weight="900" fill="url(#steel-grad)"
        letter-spacing="-8">RS</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="170" font-weight="900" fill="url(#shine)"
        letter-spacing="-8">RS</text>
  <text x="150" y="248" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="400" fill="#999" letter-spacing="3">R.S. for stainless industrial co.</text>
</svg>
